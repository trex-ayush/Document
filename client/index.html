<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS ignores the SVG/manifest icon set entirely — apple-touch-icon (PNG) is the only way
         "Add to Home Screen" gets a real icon there instead of a screenshot. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- interactive-widget: Android Chrome shrinks the page with the on-screen keyboard, so
         bottom-pinned Save buttons stay above it (iOS is handled by hooks/useVisualViewport.js). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FF5A5F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <meta name="description" content="Family Vault — a private, secure family document vault." />

    <meta property="og:title" content="Family Vault" />
    <meta property="og:description" content="Securely store and organize your family's important documents." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/assets/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Family Vault</title>
    <script>
      (function () {
        // Pre-mount theme application avoids a flash of the wrong theme. Defaults to the OS
        // preference when the user hasn't picked one explicitly yet.
        try {
          const saved = localStorage.getItem('family-vault-theme');
          const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch {
          /* localStorage may be unavailable (private mode, blocked storage) — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <!-- Boot splash: shown instantly while the app's code downloads (otherwise a blank white
         page), and replaced the moment React mounts into #root. Pure CSS, no network needed. -->
    <style>
      html, body { margin: 0; background: #FAFAF9; }
      html.dark, html.dark body { background: #0C0A09; }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .boot img { width: 64px; height: auto; animation: boot-breathe 1.8s ease-in-out infinite; }
      .boot p { margin: 0; font-size: 15px; font-weight: 600; color: #292524; letter-spacing: -0.01em; }
      html.dark .boot p { color: #F5F5F4; }
      .boot-bar { width: 120px; height: 3px; border-radius: 999px; background: #E7E5E4; overflow: hidden; position: relative; }
      html.dark .boot-bar { background: #292524; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #FF5A5F; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.85; } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-bar::after { animation: none; } }
    </style>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Family Vault">
        <img src="/assets/logo.png" alt="" width="64" height="58" decoding="async" />
        <p>Family Vault</p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
